<div class="admin-shell">
    <aside>
      <a class="brand" routerLink="/"
        ><span class="mark">İ</span
        ><span>İPEK <small>YÖNETİM PANELİ</small></span></a
      >
      <span class="label">YÖNETİM</span>
      <a
        routerLink="/admin"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active"
        ><img src="/layout-dashboard.svg" alt="" /><span>Genel Bakış</span></a
      >
      <a routerLink="/admin/orders" routerLinkActive="active"
        ><img src="/clipboard-list.svg" alt="" /><span>Siparişler</span></a
      >
      <a routerLink="/admin/products" routerLinkActive="active"
        ><img src="/package.svg" alt="" /><span>Ürünler</span></a
      >
      <a routerLink="/admin/categories" routerLinkActive="active"
        ><img src="/tags.svg" alt="" /><span>Kategoriler</span></a
      >
      <button (click)="logout()">
        <img src="/log-out.svg" alt="" /><span>Çıkış yap</span>
      </button>
      <a class="store-link" routerLink="/"
        ><img src="/arrow-left.svg" alt="" /><span>Mağazaya dön</span></a
      >
    </aside>
    <main>
      <header><span>İpek Toptan / Yönetim</span><b>Yönetici</b></header>
      <section class="content"><router-outlet /></section>
    </main>
  </div>
