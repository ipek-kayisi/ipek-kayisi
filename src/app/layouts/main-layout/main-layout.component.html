<div class="announcement">
  <img src="/leaf.svg" alt="" aria-hidden="true" /> 1.500 TL ve üzeri
  siparişlerde kargo bizden <span>·</span> Toptan alımlara özel fiyatlar
</div>
<header class="site-header">
  <a class="brand" routerLink="/" aria-label="İpek Toptan ana sayfa">
    <img src="/images/logo.jpg" alt="" />
    <span class="brand-name"><small>TOPTAN KURU GIDA</small></span>
  </a>
  <nav aria-label="Ana menü">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Ana Sayfa</a
    >
    <a routerLink="/catalog" routerLinkActive="active">Ürünler</a>
    <a routerLink="/contacts" routerLinkActive="active">İletişim</a>
  </nav>
  <div class="header-actions">
    <a class="wholesale" [href]="'tel:' + contacts.contacts().phone"
      >Toptan destek <strong>{{ contacts.contacts().phone }}</strong></a
    ><a class="cart-link" routerLink="/cart" aria-label="Sepet"
      ><img src="/shopping-basket.svg" alt="" /><span>Sepet</span
      ><b>{{ cart.count() }}</b></a
    >
  </div>
</header>
<main><router-outlet /></main>
<footer class="site-footer">
  <a class="brand footer-brand" routerLink="/"
    ><img src="/images/logo-footer.png" alt="" /><span class="brand-name"
      ><small>TOPTAN KURU GIDA</small></span
    ></a
  >
  <p>Doğanın en güzel lezzetleri, özenle sofranızda.</p>
  <span>© 2026 İpek Toptan Kuru Gıda</span>
</footer>
